name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Quickstart (bundled demo, then the offline verifier on its output)
        run: |
          npx atcn-local demo --data-dir "$RUNNER_TEMP/atcn"
          run_dir=$(ls -d "$RUNNER_TEMP"/atcn/runs/* | tail -1)
          npx atcn-verify "$run_dir/task-closure.json" --keys "$run_dir/keys.json" \
            $(for p in "$run_dir"/obligation-*.json; do echo --obligation-package "$p"; done)

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest
