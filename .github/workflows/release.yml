# Publishes on a v* tag, using npm and PyPI trusted publishing (no stored tokens). Packages are versioned
# independently: each package whose current version is not yet on the registry is published; the rest are skipped.
# Registry versions are immutable: to fix a bad release, bump the version and tag again.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Publish new package versions
        run: |
          for dir in $(node -p "require('./package.json').workspaces.join(' ')"); do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
            else
              npm publish --workspace "$dir" --access public
            fi
          done

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e 'packages/sdk-python[test]' build
      - run: pytest packages/sdk-python
      - run: python -m build packages/sdk-python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
