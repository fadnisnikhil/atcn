[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atcn"
version = "1.5.1"
description = "Python SDK for ATCN, a cost record for AI agent jobs that anyone can verify: offline verification of closures, receipts and closure packages, Ed25519 signing, API clients and A2A helpers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/fadnisnikhil/atcn"
Source = "https://github.com/fadnisnikhil/atcn/tree/main/packages/sdk-python"
Issues = "https://github.com/fadnisnikhil/atcn/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
