[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atcn"
version = "1.4.0"
description = "Python SDK for the Agent Transaction Closure Network: canonical JSON, Ed25519 event signing, webhook verification, API client, Agent Work Subledger"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/fadnisnikhil/atcn"
Source = "https://github.com/fadnisnikhil/atcn/tree/main/packages/sdk-python"
Issues = "https://github.com/fadnisnikhil/atcn/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
